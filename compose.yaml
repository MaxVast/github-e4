services:
  frontend-dev:
    build:
      context: .
      target: development
    profiles: [dev]
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  frontend-prod:
    build:
      context: .
      target: production
    profiles: [prod]
    ports:
      - "8080:80"

volumes:
  node_modules:
