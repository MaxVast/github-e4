name: Signaler un bug
description: Quelque chose ne fonctionne pas comme prévu
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Description du problème
      description: Décris précisément le problème.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Aller sur...
        2. Cliquer sur...
        3. Observer...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu

  - type: input
    id: environment
    attributes:
      label: Environnement
      placeholder: Chrome 140 / Windows 11 / etc.
